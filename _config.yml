## Module 1: Product Definition & Analysis

### 1. Product Name & Type
* **Product Name:** Jaga Lansia (JagSi)
* **Product Type:** Wearable Health-Monitoring Watch Prototype & Caregiver Companion Web Dashboard

### 2. Background & Problem Formulation
* **Background:** Indonesia has one of the fastest-growing elderly populations in Southeast Asia, reaching ~31.4 million in 2023 and projected to exceed 48 million by 2035. Many elderly individuals live alone, in remote areas, or far from their adult children. Current healthcare infrastructure lacks continuous monitoring, and most families cannot afford full-time human caregiving.
* **Problem Formulation:** How can we enable real-time health monitoring for elderly individuals who live alone or far from family, so that health concerns or emergencies (such as falls) are detected and responded to quickly without requiring frequent clinic visits?

### 3. Proposed Solution & Key Features
* **Proposed Solution:** JagSi consists of an ESP32-based wearable watch prototype with vital sensors and fall detection, connected via Wi-Fi/MQTT to Azure cloud services. Machine learning algorithms analyze vital signs and movement patterns, sending alerts to a web dashboard. The dashboard features a Gemini-powered Bahasa Indonesia chatbot for health summaries and risk indicators.
* **Key Features:**
  * **Wearable Watch & App Dashboard:** Specialized watch with health sensors and SOS button paired with a web application for caregivers.
  * **Vital Sign Monitor:** Real-time collection and display of heart rate, SpO2, and body temperature.
  * **Fall Detection:** Accelerometer/gyroscope data paired with ML algorithms to detect sudden impacts and alert caregivers via SOS.
  * **AI Health-Risk Analysis:** Analyzes vital signs, medical history, and external health APIs to present risk indicators.
  * **Bahasa Indonesia Health Chatbot:** Gemini-powered natural language assistant that simplifies health data for everyday users.

### 4. Competitor Analysis

| Competitor | Type & Focus | Strengths | Weaknesses | JagSi Advantage |
| :--- | :--- | :--- | :--- | :--- |
| **Whoop** | Direct (Athletics / Recovery) | Advanced 24/7 physiological tracking & recovery scores | High subscription cost (~$30/mo); no fall detection, SOS, or Indonesian language support | Affordable ESP32 wearable targeted specifically at elderly monitoring, fall detection, and Bahasa Indonesia AI insights. |
| **Apple Watch** | Direct (Premium Smartwatch) | ECG, SpO2, fall detection, and high-quality build | Very expensive (Rp7M–Rp15M+); requires iPhone; complex UI for non-tech-savvy elderly | Low-cost prototype with a universal web dashboard accessible on any browser or device without smartphone dependency. |
| **Wonlex** | Direct (Elderly GPS Watch) | Low cost (Rp300k–Rp800k); built-in SOS and two-way calling | No health sensors (SpO2, heart rate, temp); no fall detection ML models or AI analysis | Combines affordable hardware with full vital monitoring, ML fall detection, and Gemini AI health analysis. |
