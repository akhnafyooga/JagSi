<!--
  Draws the ```mermaid blocks (ERD, Gantt chart). GitHub Pages renders them as
  plain code otherwise; github.com does draw them, which is why it went unnoticed.
  The primer theme includes this file in <head>.
-->
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
  document.addEventListener('DOMContentLoaded', async () => {
    document.querySelectorAll('pre > code.language-mermaid, div.language-mermaid pre code').forEach((code) => {
      const box = code.closest('div.language-mermaid') || code.parentElement;
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = code.textContent;
      box.replaceWith(div);
    });
    mermaid.initialize({ startOnLoad: false, theme: 'neutral' });
    await mermaid.run({ querySelector: '.mermaid' });
  });
</script>
